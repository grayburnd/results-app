<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cats vs Dogs -- Result</title>
    <base href="__BASE_PATH__">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <meta name="keywords" content="docker-compose, docker, stack">
    <meta name="author" content="Docker">
    <style>
      @import url(//fonts.googleapis.com/css?family=Open+Sans:400,700,600);

      *{
        box-sizing:border-box;
      }
      html,body{
        margin:0;
        padding:0;
        height:100%;
        font-family: 'Open Sans';
      }
      body{
        opacity:0;
        transition: all 1s linear;
      }

      .divider{
        height: 150px;
        width:2px;
        background-color: #C0C9CE;
        position: relative;
        top: 50%;
        float: left;
        transform: translateY(-50%);
      }

      #background-stats-1{
        background-color: #2196f3;
      }

      #background-stats-2{
        background-color: #00cbca;
      }

      #content-container{
        z-index:2;
        position:relative;
        margin:0 auto;
        display:table;
        padding:10px;
        max-width:940px;
        height:100%;
      }
      #content-container-center{
        display:table-cell;
        text-align:center;
        vertical-align:middle;
      }
      #result{
        z-index: 3;
        position: absolute;
        bottom: 40px;
        right: 20px;
        color: #fff;
        opacity: 0.5;
        font-size: 45px;
        font-weight: 600;
      }
      #breakdown{
        z-index: 3;
        position: absolute;
        bottom: 100px;
        right: 20px;
        color: #fff;
        opacity: 0.5;
        font-size: 20px;
        font-weight: 600;
        text-align: right;
      }
      #choice{
        transition: all 300ms linear;
        line-height:1.3em;
        background:#fff;
        box-shadow: 10px 0 0 #fff, -10px 0 0 #fff;
        vertical-align:middle;
        font-size:40px;
        font-weight: 600;
        width: 450px;
        height: 200px;
      }

      #choice .choice{
        width: 49%;
        position: relative;
        top: 50%;
        transform: translateY(-50%);
        text-align: left;
        padding-left: 50px;
      }

      #choice .choice .label{
        text-transform: uppercase;
      }

      #choice .choice.dogs{
        color: #00cbca;
        float: right;
      }

      #choice .choice.cats{
        color: #2196f3;
        float: left;
      }
      #background-stats{
        z-index:1;
        height:100%;
        width:100%;
        position:absolute;
      }
      #background-stats div{
        transition: width 400ms ease-in-out;
        display:inline-block;
        margin-bottom:-4px;
        width:50%;
        height:100%;
      }
    </style>
  </head>
  <body>
     <div id="background-stats">
       <div id="background-stats-1">
       </div><!--
      --><div id="background-stats-2">
      </div>
    </div>
    <div id="content-container">
      <div id="content-container-center">
        <div id="choice">
          <div class="choice cats">
            <div class="label">Cats</div>
            <div class="stat" id="a-percent">50.0%</div>
          </div>
          <div class="divider"></div>
          <div class="choice dogs">
            <div class="label">Dogs</div>
            <div class="stat" id="b-percent">50.0%</div>
          </div>
        </div>
      </div>
    </div>
    <div id="result"></div>
    <div id="breakdown"></div>
    <script>
      var basePath = new URL(document.baseURI).pathname;
      var initialVotes = __INITIAL_VOTES__;
      var bg1 = document.getElementById('background-stats-1');
      var bg2 = document.getElementById('background-stats-2');
      var aPercent = document.getElementById('a-percent');
      var bPercent = document.getElementById('b-percent');
      var result = document.getElementById('result');
      var breakdown = document.getElementById('breakdown');

      function getPercentages(a, b) {
        if (a + b > 0) {
          var catShare = Math.round(a / (a + b) * 1000) / 10;
          return { a: catShare, b: Math.round((100 - catShare) * 10) / 10 };
        }

        return { a: 50, b: 50 };
      }

      function render(data) {
        var cats = parseInt(data.a || 0, 10);
        var dogs = parseInt(data.b || 0, 10);
        var total = cats + dogs;
        var percentages = getPercentages(cats, dogs);

        bg1.style.width = percentages.a + '%';
        bg2.style.width = percentages.b + '%';
        aPercent.textContent = percentages.a.toFixed(1) + '%';
        bPercent.textContent = percentages.b.toFixed(1) + '%';

        if (total === 0) {
          result.textContent = 'No votes yet';
          breakdown.textContent = 'No votes yet';
          return;
        }

        result.textContent = total === 1 ? '1 vote' : total + ' votes';
        breakdown.innerHTML = Object.keys(data)
          .filter(function(key) { return parseInt(data[key] || 0, 10) > 0; })
          .sort()
          .map(function(key) {
            return '<div>' + key.toUpperCase() + ': ' + parseInt(data[key], 10) + '</div>';
          })
          .join('');
      }

      function refresh() {
        fetch(basePath + 'results', { cache: 'no-store' })
          .then(function(response) {
            if (!response.ok) {
              throw new Error('Failed to load results');
            }
            return response.json();
          })
          .then(render)
          .catch(function(error) {
            console.error(error);
          });
      }

      render(initialVotes);
      document.body.style.opacity = 1;
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
